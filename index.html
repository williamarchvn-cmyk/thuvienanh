<style>
:root{
  --bg:#fff; --fg:#111; --muted:#6f6f6f; --line:#e7e7e7; --chip:#efefef; --chip2:#e2e2e2;
  --sel:#0b66d6; --danger:#c8241c; --warn-bg:#fff4e2; --warn-fg:#8a4a00;
  --radius:16px; --side:76px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);overscroll-behavior-y:contain}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg{display:block;flex:none}

/* ---------- Khung chính ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0;background:#fff;z-index:30}
.brand{display:flex;align-items:center;gap:10px;flex:none;padding:2px 6px 2px 0;border-radius:14px;cursor:pointer;text-decoration:none;color:var(--fg)}
.brand svg{width:40px;height:40px;border-radius:12px;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.brand b i{font-style:normal;background:linear-gradient(90deg,#4f46e5,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sidebar{padding-top:22px}
/* Dây phơi ảnh chạy ngang (thay logo khi đã có ảnh) */
.reel{--cw:42px;--ih:31px;--pitch:12px;position:relative;flex:none;width:340px;height:66px;margin:-9px 0;border-radius:16px;background:#faf8f3;overflow:hidden;cursor:pointer;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.reel::before{content:"";position:absolute;left:0;right:0;top:9px;height:1.5px;background:#7a7d6c;opacity:.75;z-index:1}
.reel-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:flex-start;gap:var(--pitch);padding-left:var(--pitch);will-change:transform;animation:reelmove var(--dur,30s) linear infinite}
@keyframes reelmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pol{position:relative;flex:none;width:var(--cw);margin-top:11px;padding:3px 3px 7px;background:#fff;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.18);transform-origin:50% -3px;animation:sway 3.2s ease-in-out infinite alternate}
.pol img{display:block;width:100%;height:var(--ih);object-fit:cover;background:#e9e5dd}
.pol::before{content:"";position:absolute;left:50%;top:-6px;width:5px;height:11px;margin-left:-2.5px;border-radius:2px;background:var(--pin,#c49a7f);z-index:2}
.pol:nth-child(even){--pin:#6f7562}
@keyframes sway{from{transform:rotate(calc(var(--r,0deg) - 2.5deg))}to{transform:rotate(calc(var(--r,0deg) + 2.5deg))}}
.reel-wrap{display:flex;flex:none}
.reel-wrap .brand{display:none}
.reel-wrap.empty .reel{display:none}
.reel-wrap.empty .brand{display:flex}
.navbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#222;transition:background .15s}
.navbtn:hover{background:var(--chip)}
.navbtn.active{background:#111;color:#fff}
.sidebar .grow{flex:1}
.main{margin-left:var(--side);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 24px}
.search{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 18px;border-radius:24px;background:var(--chip);color:#555;transition:box-shadow .15s}
.search:focus-within{box-shadow:0 0 0 3px #cfe0f7;background:#fff}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--fg)}
.search input::placeholder{color:#777}
.search .clear{width:32px;height:32px;border-radius:16px;display:none;place-items:center}
.search .clear:hover{background:var(--chip2)}
.search.has .clear{display:grid}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#1f9d55}
.sync.syncing i{background:#e0a100;animation:pulse 1s infinite}
.sync.offline i{background:#999}
@keyframes pulse{50%{opacity:.3}}
.mockpill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#fff1c9;color:#7a5a00;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:var(--chip);font-weight:600;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--chip2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:#111;color:#fff}
.btn.primary:hover{background:#333}
.btn.danger{background:#fbe9e8;color:var(--danger)}
.btn.icon{width:40px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{height:48px;padding:0 22px;border-radius:24px}

.view{padding:4px 24px 140px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.tabs{display:flex;gap:22px}
.tab{font-weight:600;font-size:16px;padding:6px 0;border-bottom:3px solid transparent}
.tab.active{border-color:#111}
.sub{color:var(--muted);font-size:14px}
h1{font-size:28px;line-height:1.2;margin:0}
.linkbtn{color:var(--sel);font-weight:600;font-size:14px}

.banner{margin:0 24px 12px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.danger{background:#fde8e7;color:var(--danger)}
.banner:empty{display:none}

/* ---------- Lưới so le ---------- */
.grid{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card{position:absolute;top:0;left:0}
.grid.anim .card:not(.fresh){transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.card.fresh{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}}
.grid.sortable .thumb{cursor:grab}
.grid.sorting,.grid.sorting *{cursor:grabbing!important}
.grid.sorting .card:not(.dragging) .thumb::after,.grid.sorting .card .qa,.grid.sorting .card .chk{display:none}
.card.dragging{opacity:.28}
.card.dragging .thumb{outline:2px dashed #4f46e5;outline-offset:-2px}
.card.armed .thumb{transform:scale(.95);transition:transform .15s}
.ghost{position:fixed;left:0;top:0;z-index:120;pointer-events:none;border-radius:var(--radius);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);background:#ddd;will-change:transform}
.ghost img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{position:relative;border-radius:var(--radius);overflow:hidden;cursor:zoom-in;transition:box-shadow .15s}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.thumb img.loaded{opacity:1}
.thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.22);opacity:0;transition:opacity .15s;pointer-events:none}
.chk{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:transparent;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s;z-index:2}
.qa{position:absolute;top:10px;right:10px;height:34px;padding:0 14px;border-radius:17px;background:#111;color:#fff;font-weight:600;font-size:13px;opacity:0;transition:opacity .15s;z-index:2}
.qa:hover{background:#333}
@media (hover:hover){
  .card:hover .thumb::after{opacity:1}
  .card:hover .chk,.card:hover .qa{opacity:1}
}
body.selecting .chk{opacity:1}
body.selecting .qa{display:none}
body.selecting .thumb{cursor:pointer}
.card.selected .thumb{box-shadow:0 0 0 3px var(--sel)}
.card.selected .chk{background:var(--sel);border-color:var(--sel);color:#fff;opacity:1}
.card.selected .thumb img{transform:scale(.96);border-radius:12px}
.thumb img{transition:opacity .35s,transform .15s}
.foot{height:30px;display:flex;justify-content:flex-end;align-items:center}
.more{width:36px;height:26px;border-radius:13px;display:grid;place-items:center;color:#333}
.more:hover{background:var(--chip)}
.up{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;gap:6px;padding:10px;background:rgba(255,255,255,.5);z-index:3;font-size:12px;font-weight:600}
.up-bar{height:6px;border-radius:3px;background:rgba(0,0,0,.15);overflow:hidden}
.up-bar i{display:block;height:100%;width:0;background:#111;transition:width .2s}
.card.uploading .up{display:flex}
.card.error .up{display:flex;background:rgba(200,36,28,.82);color:#fff;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.card.error .up-bar{display:none}

.empty{max-width:560px;margin:48px auto;padding:48px 24px;border:2px dashed #cfcfcf;border-radius:24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin:12px 0 6px;font-size:20px}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--chip);display:grid;place-items:center;margin:0 auto;color:#333}
.empty .btn{margin-top:16px}
.noresult{text-align:center;color:var(--muted);padding:64px 16px}

/* ---------- Album ---------- */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 20px}
.acard{cursor:pointer;position:relative}
.collage{aspect-ratio:3/2;border-radius:var(--radius);overflow:hidden;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#fff}
.collage>div{background:var(--chip);overflow:hidden}
.collage>div:first-child{grid-row:span 2}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.acard:hover .collage{filter:brightness(.92)}
.acard h3{font-size:16px;margin:10px 0 0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .amore{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .15s}
@media (hover:hover){.acard:hover .amore{opacity:1}}
@media (hover:none){.acard .amore{opacity:1}}
.acard.new .collage{display:grid;place-items:center;grid-template-columns:1fr;grid-template-rows:1fr;border:2px dashed #cfcfcf;background:#fafafa;color:#333}
.album-head{text-align:center;margin:8px 0 26px}
.album-head .back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;text-decoration:none;margin-bottom:8px}
.album-head .back:hover{color:var(--fg)}
.album-head .row{display:flex;gap:8px;justify-content:center;margin-top:14px}

/* ---------- Cài đặt ---------- */
/* ---------- Trang Tệp ---------- */
.flist{display:flex;flex-direction:column;gap:8px;max-width:980px}
.frow{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;transition:background .15s,box-shadow .15s}
@media (hover:hover){.frow:hover{background:#fafafa;box-shadow:0 2px 10px rgba(0,0,0,.05)}}
.ficon{position:relative;flex:none;width:42px;height:50px;border-radius:9px 15px 9px 9px;background:var(--fc,#6b7280);color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:10.5px;font-weight:800;letter-spacing:.3px;overflow:hidden}
.ficon::before{content:"";position:absolute;top:0;right:0;width:14px;height:14px;background:rgba(255,255,255,.4);border-bottom-left-radius:6px}
.fmain{flex:1;min-width:0}
.fname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sub{font-size:13px}
.fbar{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:#111;transition:width .2s}
.frow.error .sub{color:var(--danger)}
.frow .btn.icon{flex:none;width:38px;height:38px}
.frow .more{flex:none}
.fnote{max-width:980px;margin:0 0 14px;color:var(--muted);font-size:13px}
.set-card{max-width:720px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.set-card h2{font-size:17px;margin:0 0 4px}
.set-card p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.meter{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;background:#111;border-radius:6px;transition:width .3s}
.meter.warn i{background:#e08a00}.meter.full i{background:var(--danger)}
.big-num{font-size:26px;font-weight:700}
.set-row{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--chip);color:#444;margin-left:6px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0}
.switch input{width:18px;height:18px}

/* ---------- Thanh dưới (mobile) ---------- */
.bottomnav{display:none}

/* ---------- Thanh chọn nhiều ---------- */
.selbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:40;background:#111;color:#fff;border-radius:28px;padding:6px;display:flex;align-items:center;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.selbar.show{transform:translate(-50%,0)}
.selbar:not(.show){visibility:hidden;opacity:0;transition:transform .25s,opacity .2s,visibility 0s .25s}
.selbar button{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;font-weight:600;font-size:14px;white-space:nowrap}
.selbar button:hover{background:rgba(255,255,255,.14)}
.selbar .danger{color:#ff8a83}
.selbar .sb-n{padding:0 10px 0 4px;font-weight:700;white-space:nowrap}
.selbar .sb-x{width:40px;padding:0;justify-content:center}

/* ---------- Thông báo ---------- */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
body.selecting .toasts{bottom:88px}
.toast{pointer-events:auto;background:#111;color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;animation:toastin .25s ease}
.toast button{color:#8ec2ff;font-weight:700}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}

/* ---------- Bảng tải lên ---------- */
.uppanel{position:fixed;right:24px;bottom:24px;width:360px;max-height:50vh;z-index:45;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:none;flex-direction:column;overflow:hidden}
.uppanel.show{display:flex}
.uphead{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;font-weight:700;border-bottom:1px solid var(--line)}
.uphead span{flex:1}
.uphead button{width:32px;height:32px;border-radius:16px;display:grid;place-items:center}
.uphead button:hover{background:var(--chip)}
.uplist{overflow:auto;padding:6px 0}
.uppanel.min .uplist{display:none}
.upitem{padding:8px 16px;font-size:13px}
.upitem .r1{display:flex;justify-content:space-between;gap:8px}
.upitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.upitem .st{color:var(--muted);white-space:nowrap}
.upitem.err .st{color:var(--danger)}
.upitem.ok .st{color:#1f8a4c}
.upitem .r2{color:var(--muted);font-size:12px;margin-top:2px;display:flex;justify-content:space-between}
.upitem .bar{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.upitem .bar i{display:block;height:100%;background:#111;transition:width .2s}
.upitem .retry{color:var(--sel);font-weight:700}

/* ---------- Lớp thả ảnh ---------- */
.drop{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(2px)}
.drop.show{display:grid}
.drop .box{width:min(560px,86vw);padding:56px 24px;border:3px dashed #111;border-radius:28px;text-align:center;background:#fff;pointer-events:none}
.drop h2{margin:14px 0 4px;font-size:24px}
.drop .ic{width:72px;height:72px;border-radius:24px;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto}

/* ---------- Xem ảnh lớn ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:#0e0e0e;display:none}
.viewer.open{display:flex}
.v-stage{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
/* Ảnh phủ toàn màn hình, giữ đúng tỉ lệ, không bị cắt */
.v-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .25s ease, opacity .2s}
.v-btn{position:absolute;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;transition:background .15s;z-index:2}
.v-btn:hover{background:rgba(255,255,255,.26)}
.v-close{top:16px;left:16px}
.v-prev{left:16px;top:50%;margin-top:-22px}
.v-next{right:16px;top:50%;margin-top:-22px}
.v-btn[disabled]{opacity:.25;pointer-events:none}

function makeMockPhoto(createdAt) {
  const i = ++mockSeq;

function seedMock(count) {

let sb = null;   // Supabase client, tạo trong init()
const unwrap = ({ data, error }) => { if (error) throw new Error(error.message || String(error)); return data; };
const chunks = (arr, n) => Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n));

/** Supabase trả tối đa 1.000 dòng mỗi lần → tải theo trang */
async function fetchAllRows(table, orders) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select('*');
    for (const [col, asc] of orders) q = q.order(col, { ascending: asc });
    const rows = unwrap(await q.range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}
async function restAll(table, order) {
  const out = [], h = { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY };
  for (let from = 0; ; from += 1000) {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=*&order=${order}&limit=1000&offset=${from}`, { headers: h, cache: 'no-store' });
    if (!r.ok) { let m = 'Máy chủ báo lỗi ' + r.status; try { m = (await r.json()).message || m; } catch {} throw new Error(m); }
    const rows = await r.json(); out.push(...rows);
    if (rows.length < 1000) return out;
  }
}
/** Tải 1 file lên kho bằng XHR để có % tiến độ */
function uploadFile(path, blob, onProgress) { return uploadObject(CONFIG.BUCKET, path, blob, 'image/webp', onProgress); }
function uploadObject(bucket, path, blob, contentType, onProgress) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', `${CONFIG.SUPABASE_URL}/storage/v1/object/${bucket}/${path}`);
    x.setRequestHeader('apikey', CONFIG.SUPABASE_ANON_KEY);
    x.setRequestHeader('Authorization', 'Bearer ' + CONFIG.SUPABASE_ANON_KEY);
    x.setRequestHeader('x-upsert', 'false');
    x.setRequestHeader('cache-control', 'max-age=31536000');
    x.setRequestHeader('content-type', contentType);
    x.timeout = Math.max(120000, blob.size / 40);   // tệp lớn được chờ lâu hơn (tính theo mạng chậm ~40 KB/s)
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return res();
      let msg = x.responseText; try { const j = JSON.parse(msg); msg = j.message || j.error || msg; } catch {}
      if (/duplicate|already exists/i.test(msg)) return res();   // thử lại sau khi file đã lên → coi như xong
      if (x.status === 413 || /maximum allowed size|too large/i.test(msg)) return rej(new Error('Tệp vượt quá 50 MB'));
      if (/bucket not found/i.test(msg)) return rej(new Error('Chưa có kho "' + bucket + '" — cần chạy lại schema.sql'));
      if (/mime type/i.test(msg)) return rej(new Error('Kho chưa cho phép định dạng này — cần chạy lại schema.sql'));
      rej(new Error(`Kho ảnh báo lỗi ${x.status}: ${msg}`));
    };
    x.onerror = () => rej(new Error('Mất kết nối khi tải lên'));
    x.ontimeout = () => rej(new Error('Tải lên quá lâu, hãy thử lại'));
    x.send(blob);
  });
}
const pathsOf = id => [`full/${id}.webp`, `thumb/${id}.webp`];

const DOC_BUCKET = 'files';
const albumTop = new Map();   // album -> vị trí lớn nhất đã cấp
const realApi = {
  async listAll() {
    // Gọi thẳng REST bằng fetch → chạy song song với việc tải thư viện Supabase, không phải chờ
    const [photos, albums, links, files] = await Promise.all([
      restAll('photos', 'created_at.desc,id.asc'),
      restAll('albums', 'created_at.asc,id.asc'),
      restAll('album_photos', 'album_id.asc,photo_id.asc'),
      restAll('files', 'created_at.desc,id.asc').then(r => { S.filesMissing = false; return r; }, () => { S.filesMissing = true; return []; }),   // chưa chạy SQL phần Tệp → app ảnh vẫn chạy bình thường
    ]);
    return { photos, albums, links, files };
  },
  async uploadPhoto({ fullBlob, thumbBlob, row }, onProgress) {
    // Tải thumbnail và ảnh lớn CÙNG LÚC
    const tw = thumbBlob.size / (thumbBlob.size + fullBlob.size); let pa = 0, pb = 0;
    const rep = () => onProgress((pa * tw + pb * (1 - tw)) * .95);
    await Promise.all([
      uploadFile(row.thumb_path, thumbBlob, p => { pa = p; rep(); }),
      uploadFile(row.full_path, fullBlob, p => { pb = p; rep(); }),
    ]);
    try {
      const saved = unwrap(await sb.from('photos').upsert(row, { onConflict: 'id' }).select().single());
      onProgress(1); return saved;
    } catch (err) {
      await sb.storage.from(CONFIG.BUCKET).remove([row.thumb_path, row.full_path]).catch(() => {});
      throw err;
    }
  },
  async updatePhoto(id, patch) {
    const rows = unwrap(await sb.from('photos').update(patch).eq('id', id).select());
    if (!rows.length) throw new Error('Ảnh không còn tồn tại');
    return rows[0];
  },
  async deletePhotos(ids) {
    for (const part of chunks(ids, 100)) {
      unwrap(await sb.from('photos').delete().in('id', part));
      // Xóa file; nếu lỗi thì file thừa sẽ được dọn bằng nút "Dọn file thừa"
      await sb.storage.from(CONFIG.BUCKET).remove(part.flatMap(pathsOf)).catch(() => {});
    }
  },
  async createAlbum(name) { return unwrap(await sb.from('albums').insert({ name }).select().single()); },
  async updateAlbum(id, patch) {
    const rows = unwrap(await sb.from('albums').update(patch).eq('id', id).select());
    if (!rows.length) throw new Error('Album không còn tồn tại');
    return rows[0];
  },
  async deleteAlbum(id) { unwrap(await sb.from('albums').delete().eq('id', id)); },
  async addToAlbum(albumId, photoIds) {
    // Vị trí mới tính ngay trên máy (đã có sẵn dữ liệu album) → bớt 1 lượt hỏi máy chủ cho mỗi ảnh, và các ảnh tải cùng lúc không bị trùng số
    let max = Math.max(0, albumTop.get(albumId) || 0, ...albumLinks(albumId).map(l => l.position));
    const rows = photoIds.map(pid => ({ album_id: albumId, photo_id: pid, position: (max += 1000) }));
    albumTop.set(albumId, max);
    const out = [];
    for (const part of chunks(rows, 200)) out.push(...unwrap(await sb.from('album_photos').upsert(part, { onConflict: 'album_id,photo_id', ignoreDuplicates: true }).select()));
    return out;
  },
  async setPositions(albumId, updates) {
    if (updates.length === 1) {
      const r = unwrap(await sb.from('album_photos').update({ position: updates[0].position }).eq('album_id', albumId).eq('photo_id', updates[0].photo_id).select());
      if (!r.length) throw new Error('Ảnh không còn trong album');
      return;
    }
    for (const part of chunks(updates, 200)) {
      const rows = part.map(u => ({ album_id: albumId, photo_id: u.photo_id, position: u.position }));
      unwrap(await sb.from('album_photos').upsert(rows, { onConflict: 'album_id,photo_id' }).select());
    }
  },
  async removeFromAlbum(albumId, photoIds) {
    for (const part of chunks(photoIds, 100)) unwrap(await sb.from('album_photos').delete().eq('album_id', albumId).in('photo_id', part));
  },
  async uploadDoc({ file, row }, onProgress) {
    await uploadObject(DOC_BUCKET, row.path, file, row.mime, p => onProgress(p * .97));
    try { const saved = unwrap(await sb.from('files').insert(row).select().single()); onProgress(1); return saved; }
    catch (err) {
      await sb.storage.from(DOC_BUCKET).remove([row.path]).catch(() => {});
      if (/files.*(does not exist|schema cache)|relation .*files/i.test(err.message)) throw new Error('Chưa có bảng "files" — cần chạy lại schema.sql');
      throw err;
    }
  },
  async updateFile(id, patch) {
    const rows = unwrap(await sb.from('files').update(patch).eq('id', id).select());
    if (!rows.length) throw new Error('Tệp không còn tồn tại');
    return rows[0];
  },
  async deleteFiles(rows) {
    for (const part of chunks(rows, 100)) {
      unwrap(await sb.from('files').delete().in('id', part.map(r => r.id)));
      await sb.storage.from(DOC_BUCKET).remove(part.map(r => r.path)).catch(() => {});
    }
  },
  async cleanupOrphans() {
    let docStale = 0;
    try {   // tệp tài liệu thừa
      const fids = new Set((await fetchAllRows('files', [['id', true]])).map(f => f.id)), stale = [];
      for (let offset = 0; ; offset += 1000) {
        const list = unwrap(await sb.storage.from(DOC_BUCKET).list('docs', { limit: 1000, offset, sortBy: { column: 'name', order: 'asc' } }));
        for (const f of list) { const id = f.name.replace(/\.[^.]*$/, ''); if (f.id && !fids.has(id) && (!f.created_at || Date.parse(f.created_at) < Date.now() - 10 * 60e3)) stale.push('docs/' + f.name); }
        if (list.length < 1000) break;

  },
  async cleanupPhotoOrphans() {
    const ids = new Set((await fetchAllRows('photos', [['id', true]])).map(p => p.id));
    const cutoff = Date.now() - 10 * 60e3;   // bỏ qua file mới (có thể đang tải lên dở)
    const stale = [];

        }

  subscribe(handler, onStatus) {
    const ch = sb.channel('thuvienanh-db');
    for (const table of ['photos', 'albums', 'album_photos']) {
      ch.on('postgres_changes', { event: '*', schema: 'public', table }, p => handler({ table, type: p.eventType, row: p.new, old: p.old }));
    }
    ch.subscribe(status => onStatus?.(status));
    const ch2 = sb.channel('thuvienanh-files');
    ch2.on('postgres_changes', { event: '*', schema: 'public', table: 'files' }, p => handler({ table: 'files', type: p.eventType, row: p.new, old: p.old }));
    ch2.subscribe();
  },
};

/* Thư viện Supabase tải nền; thao tác nào cần nó thì tự chờ (thường chỉ vài phần mười giây đầu) */
let sbOk, sbFail; const sbReady = new Promise((a, b) => { sbOk = a; sbFail = b; }); sbReady.catch(() => {});
for (const k of Object.keys(realApi)) {

/* ---------- Bản lưu tạm trên máy: mở app là thấy ảnh ngay, rồi mới đối chiếu với máy chủ ---------- */
const CACHE_KEY = 'tva-cache-v1:' + CONFIG.SUPABASE_URL;
function readCache() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); return c && Array.isArray(c.photos) ? c : null; } catch { return null; } }
function writeCache() {
  if (CONFIG.USE_MOCK || !S.loaded) return;

/** Tạo URL ảnh. Khi chuyển kho sang Cloudflare R2 chỉ cần sửa hàm này. */
function photoUrl(p, kind) {
  if (p._local) return p._local[kind];
  if (CONFIG.USE_MOCK) return MOCK_URLS[p.id]?.[kind] || '';
  const path = kind === 'thumb' ? p.thumb_path : p.full_path;
  return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/${CONFIG.BUCKET}/${path}`;
}
/** URL tệp tài liệu. download=true → trình duyệt tải về với đúng tên gốc */
function fileUrl(f, download) {
  if (f._local) return f._local;
  if (CONFIG.USE_MOCK) return MOCK_FILE_URLS[f.id] || '';
  return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/${DOC_BUCKET}/${f.path}` + (download ? '?download=' + encodeURIComponent(f.name) : '');
}
function fallbackImg(p) {
  const c = softColor(p.id);
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${p.width} ${p.height}"><rect width="100%" height="100%" fill="${c}"/></svg>`);
}

/* =========================================================================
   TRẠNG THÁI
   ========================================================================= */
const S = {
  photos: new Map(), albums: new Map(), links: new Map(),   // links: "albumId|photoId" -> link
  pendingDelete: new Set(), selected: new Set(), selecting: false,
  query: '', route: { name: 'all' }, uploads: [], sync: 'ok', extraBytes: 0,
  loaded: false, loadError: null,
  files: new Map(), pendingFileDel: new Set(), filesMissing: false,
};
const linkKey = (a, p) => a + '|' + p;
const posSaving = new Map();   // liên kết đang lưu vị trí -> bỏ qua tin realtime cũ để ảnh không nhảy lại
const recentDel = new Map();   // id ảnh vừa xóa -> thời điểm

function applyPhoto(row) { const o = S.photos.get(row.id); S.photos.set(row.id, o ? { ...o, ...row } : row); }
function applyAlbum(row) { const o = S.albums.get(row.id); S.albums.set(row.id, o ? { ...o, ...row } : row); }
function applyLink(l) { S.links.set(linkKey(l.album_id, l.photo_id), l); }
function removeLink(albumId, photoId) { S.links.delete(linkKey(albumId, photoId)); }
function removePhotoLocal(id) {
  S.photos.delete(id);
  for (const [k, l] of S.links) if (l.photo_id === id) S.links.delete(k);
  for (const a of S.albums.values()) if (a.cover_photo_id === id) a.cover_photo_id = null;
  const el = cardEls.get(id); if (el) { el.remove(); cardEls.delete(id); }
  S.selected.delete(id);
}
function applyFile(row) { const o = S.files.get(row.id); S.files.set(row.id, o ? { ...o, ...row } : row); }
function removeFileLocal(id) { S.files.delete(id); }
function sortedFiles() { return [...S.files.values()].filter(f => !S.pendingFileDel.has(f.id)).sort((a, b) => (b.created_at < a.created_at ? -1 : b.created_at > a.created_at ? 1 : 0)); }
function removeAlbumLocal(id) {
  S.albums.delete(id);
  for (const [k, l] of S.links) if (l.album_id === id) S.links.delete(k);
}
function loadSnapshot(data) {
  const temps = [...S.photos.values()].filter(p => p._status || (p._savedAt && Date.now() - p._savedAt < 30000));
  const locals = new Map([...S.photos.values()].filter(p => p._local).map(p => [p.id, p._local]));
  S.photos = new Map(); S.albums = new Map(); S.links = new Map();
  data.photos.filter(p => !(recentDel.get(p.id) > Date.now() - 30000)).forEach(p => S.photos.set(p.id, locals.has(p.id) ? { ...p, _local: locals.get(p.id) } : p));
  temps.forEach(p => { if (p._status || !S.photos.has(p.id)) S.photos.set(p.id, p); });
  data.albums.forEach(applyAlbum);
  data.links.forEach(applyLink);
  const ftemps = [...S.files.values()].filter(f => f._status || (f._savedAt && Date.now() - f._savedAt < 30000));
  S.files = new Map();
  (data.files || []).filter(f => !(recentDel.get(f.id) > Date.now() - 30000)).forEach(applyFile);
  ftemps.forEach(f => { if (f._status || !S.files.has(f.id)) S.files.set(f.id, f); });
  for (const id of [...cardEls.keys()]) if (!S.photos.has(id)) { cardEls.get(id).remove(); cardEls.delete(id); }
}

const alive = p => p && !S.pendingDelete.has(p.id);
/* Thứ tự ở "Tất cả ảnh": ảnh đã kéo dùng cột position, ảnh chưa kéo dùng thời điểm tải lên (ms). Số lớn nằm trên. */
const sortKey = p => (typeof p.position === 'number' ? p.position : Date.parse(p.created_at) || 0);
function sortedPhotos() { return [...S.photos.values()].filter(alive).sort((a, b) => (sortKey(b) - sortKey(a)) || (b.created_at < a.created_at ? -1 : b.created_at > a.created_at ? 1 : 0)); }
function albumLinks(albumId) { return [...S.links.values()].filter(l => l.album_id === albumId).sort((a, b) => b.position - a.position); }
function albumPhotos(albumId) {
  const temps = [...S.photos.values()].filter(p => p._status && p._albumId === albumId && alive(p)).sort((a, b) => b.created_at.localeCompare(a.created_at));
  return temps.concat(albumLinks(albumId).map(l => S.photos.get(l.photo_id)).filter(alive));
}
function photoAlbums(photoId) { return [...S.links.values()].filter(l => l.photo_id === photoId).map(l => S.albums.get(l.album_id)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, 'vi')); }
function allTags() { const m = new Map(); for (const p of S.photos.values()) for (const t of p.tags || []) m.set(t, (m.get(t) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]); }
function storageUsed() { let n = S.extraBytes; for (const p of S.photos.values()) n += p.size_bytes || 0; for (const f of S.files.values()) n += f.size_bytes || 0; return n; }
function filesBytes() { let n = 0; for (const f of S.files.values()) if (!f._status) n += f.size_bytes || 0; return n; }
function realCount() { return [...S.photos.values()].filter(p => !p._status && alive(p)).length; }

function filterByQuery(list) {
  const tokens = norm(S.query).split(/\s+/).filter(Boolean);
  if (!tokens.length) return list;
  const names = new Map();
  for (const l of S.links.values()) { const a = S.albums.get(l.album_id); if (a) names.set(l.photo_id, (names.get(l.photo_id) || '') + ' ' + a.name); }
  return list.filter(p => {
    const hay = norm([p.note, (p.tags || []).join(' '), p.original_name, names.get(p.id) || '', p.source_url || ''].join(' '));
    return tokens.every(t => hay.includes(t));
  });
}

/* =========================================================================
   LƯỚI SO LE (masonry): mỗi ảnh vào cột đang thấp nhất
   ========================================================================= */
const cardEls = new Map();   // id -> phần tử thẻ ảnh (dùng lại giữa các trang)

function createCard(p) {
  const el = document.createElement('div');
  el.className = 'card fresh'; el.dataset.id = p.id;
  el.innerHTML = `<div class="thumb" style="background:${softColor(p.id)}"><img alt="" loading="lazy" decoding="async" draggable="false"><button class="chk" aria-label="Chọn ảnh">${icon('check', 16)}</button><button class="qa">Lưu vào album</button><div class="up"><span class="up-txt"></span><div class="up-bar"><i></i></div></div></div><div class="foot"><button class="more" aria-label="Tùy chọn">${icon('more', 20)}</button></div>`;
  const img = el.querySelector('img');
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => { if (!img.dataset.fb) { img.dataset.fb = '1'; img.src = fallbackImg(p); } };
  return el;
}
function updateCard(el, p) {
  const img = el.querySelector('img'); const src = photoUrl(p, 'thumb');
  if (img.dataset.src !== src) { img.dataset.src = src; delete img.dataset.fb; img.classList.remove('loaded'); img.src = src; }
  el.classList.toggle('selected', S.selected.has(p.id));
  el.classList.toggle('uploading', p._status === 'uploading');
  el.classList.toggle('error', p._status === 'error');
  if (p._status === 'uploading') {
    el.querySelector('.up-txt').textContent = `Đang tải lên ${Math.round((p._progress || 0) * 100)}%`;
    el.querySelector('.up-bar i').style.width = Math.round((p._progress || 0) * 100) + '%';
  } else if (p._status === 'error') {
    el.querySelector('.up-txt').textContent = 'Tải lên lỗi · Bấm để thử lại';
  }
}

class Masonry {
  constructor(host) {
    this.root = document.createElement('div'); this.root.className = 'grid';
    host.appendChild(this.root);
    this.items = []; this.first = true; this.lastW = 0; this.pos = new Map(); this.drag = null; this.sortAlbum = null;
    this.ro = new ResizeObserver(() => { if (this.root.clientWidth !== this.lastW) this.schedule(); });
    this.ro.observe(this.root);
    bindGridEvents(this.root, this);
  }
  setItems(list) {
    if (this.drag) { this.pendingList = list; return; }
    this.items = list;
    const ids = new Set(list.map(p => p.id));
    for (const el of [...this.root.children]) if (!ids.has(el.dataset.id)) el.remove();
    let n = 0;
    for (const p of list) {
      let el = cardEls.get(p.id);
      if (!el) { el = createCard(p); cardEls.set(p.id, el); }
      if (n++ < 12) { const im = el.querySelector('img'); if (im.loading !== 'eager') { im.loading = 'eager'; im.fetchPriority = 'high'; } }   // hàng ảnh đầu: tải ngay, ưu tiên cao
      updateCard(el, p);
      if (el.parentNode !== this.root) this.root.appendChild(el);
    }
    this.layout();
  }
  schedule() { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(() => this.layout()); }
  layout() {
    const W = this.root.clientWidth; if (!W) return; this.lastW = W;
    const mob = isMobile(), gap = mob ? 8 : 16, foot = mob ? 26 : 30;
    const cols = mob ? 2 : Math.max(2, Math.min(7, Math.floor((W + gap) / (250 + gap))));
    const colW = (W - gap * (cols - 1)) / cols;
    const hs = new Array(cols).fill(0);
    this.pos = new Map();
    for (const p of this.items) {
      const el = cardEls.get(p.id); if (!el) continue;
      let c = 0; for (let i = 1; i < cols; i++) if (hs[i] < hs[c] - 1) c = i;
      const ih = Math.round(colW * p.height / p.width);
      el.style.width = colW + 'px';
      el.firstElementChild.style.height = ih + 'px';
      el.style.transform = `translate(${Math.round(c * (colW + gap))}px,${hs[c]}px)`;
      this.pos.set(p.id, { x: c * (colW + gap), y: hs[c], w: colW, h: ih + foot });
      hs[c] += ih + foot + gap;
    }
    this.root.style.height = Math.max(0, ...hs) + 'px';
    const fresh = $$('.card.fresh', this.root);
    requestAnimationFrame(() => requestAnimationFrame(() => fresh.forEach(e => e.classList.remove('fresh'))));
    const many = this.items.length > 600;
    if (this.first) { this.first = false; if (!many) requestAnimationFrame(() => this.root.classList.add('anim')); }
    else this.root.classList.toggle('anim', !many);
  }
  destroy() { this.ro.disconnect(); }
}

function bindGridEvents(root, grid) {
  let lp = null, suppressClick = false;
  root.addEventListener('pointerdown', e => {
    suppressClick = false;
    const card = e.target.closest('.card'); if (!card || e.pointerType === 'mouse') return;
    const x = e.clientX, y = e.clientY;
    lp = { x, y, t: setTimeout(() => {
      suppressClick = true; navigator.vibrate?.(15); lp = null;
      if (grid.canSort()) { grid.armed = { id: card.dataset.id, pointerId: e.pointerId, x, y, el: card }; card.classList.add('armed'); }   // album: nhấn giữ = chuẩn bị kéo; thả ra không kéo = chọn ảnh
      else enterSelect(card.dataset.id);
    }, 450) };
  });
  const cancel = e => { if (lp && (!e.clientX || Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10)) { clearTimeout(lp.t); lp = null; } };
  bindSort(root, grid);
  root.addEventListener('pointermove', cancel);
  root.addEventListener('pointerup', () => {
    if (lp) { clearTimeout(lp.t); lp = null; }
    if (grid.armed && !grid.drag) { const a = grid.armed; grid.disarm(); enterSelect(a.id); }
  });
  root.addEventListener('pointercancel', () => { if (lp) { clearTimeout(lp.t); lp = null; } if (grid.armed && !grid.drag) grid.disarm(); });
  root.addEventListener('contextmenu', e => { if (e.target.closest('.card') && !matchMedia('(hover:hover)').matches) e.preventDefault(); });
  root.addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    if (grid.justDragged) return;
    if (suppressClick) { suppressClick = false; return; }
    const id = card.dataset.id, p = S.photos.get(id); if (!p) return;
    if (e.target.closest('.more')) return openMenu(e.target.closest('.more'), cardMenu(id));
    if (p._status === 'error') return retryUpload(id);
    if (p._status === 'uploading') return toast('Ảnh đang tải lên, chờ chút nhé');
    if (e.target.closest('.chk')) return toggleSelect(id);
    if (S.selecting) return toggleSelect(id);
    if (e.target.closest('.qa')) return addToAlbumFlow([id]);
    openViewer(id);
  });
}


/* =========================================================================
   KÉO THẢ SẮP XẾP ẢNH TRONG ALBUM
   - Máy tính: nhấn chuột vào ảnh rồi kéo.
   - Điện thoại: nhấn giữ ảnh (rung nhẹ) rồi kéo. Nhấn giữ xong thả ra = chọn ảnh.
   - Thứ tự lưu ở album_photos.position (số lớn nằm trên). Chèn vào giữa 2 ảnh = lấy số ở giữa.
   ========================================================================= */
Masonry.prototype.canSort = function () {
  if (S.query || S.selecting) return false;
  if (this.sortAll) return S.route.name === 'all';
  return !!this.sortAlbum && S.route.name === 'album' && S.route.id === this.sortAlbum;
};
Masonry.prototype.disarm = function () { this.armed?.el?.classList.remove('armed'); this.armed = null; };

function bindSort(root, grid) {
  let st = null;   // { id, el, pid, sx, sy, ox, oy, w, h, ghost, lastMove, cx, cy, raf }
  const THRESH = 7;

  root.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || !grid.canSort()) return;
    if (e.target.closest('button')) return;
    const card = e.target.closest('.card'); if (!card) return;
    const p = S.photos.get(card.dataset.id); if (!p || p._status) return;
    st = { id: card.dataset.id, el: card, pid: e.pointerId, sx: e.clientX, sy: e.clientY, started: false };
  });
  root.addEventListener('pointermove', e => {
    if (grid.armed && !st && e.pointerId === grid.armed.pointerId && Math.hypot(e.clientX - grid.armed.x, e.clientY - grid.armed.y) > 4) {
      const a = grid.armed; grid.disarm();
      st = { id: a.id, el: a.el, pid: a.pointerId, sx: a.x, sy: a.y, started: false, touch: true };
      begin(e);
    }
    if (!st || e.pointerId !== st.pid) return;
    st.cx = e.clientX; st.cy = e.clientY;
    if (!st.started && Math.hypot(e.clientX - st.sx, e.clientY - st.sy) > THRESH) begin(e);
  });
  // Điện thoại: sau khi nhấn giữ thì chặn trình duyệt cuộn trang để kéo ảnh được
  root.addEventListener('touchmove', e => { if (grid.armed || grid.drag) e.preventDefault(); }, { passive: false });
  const up = e => { if (st && e.pointerId === st.pid) finish(e.type === 'pointercancel'); };
  root.addEventListener('pointerup', up);
  root.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && grid.drag) finish(true); });

  function begin(e) {
    if (!grid.canSort()) { st = null; return; }
    st.started = true;
    const r = st.el.getBoundingClientRect(), tr = st.el.firstElementChild.getBoundingClientRect();
    st.ox = st.sx - tr.left; st.oy = st.sy - tr.top; st.w = tr.width; st.h = tr.height;
    st.orig = grid.items.map(p => p.id);
    st.cx = e.clientX; st.cy = e.clientY; st.lastMove = 0;
    try { root.setPointerCapture(st.pid); } catch {}
    const g = document.createElement('div'); g.className = 'ghost';
    g.style.width = st.w + 'px'; g.style.height = st.h + 'px';
    const src = st.el.querySelector('img');
    const im = document.createElement('img'); im.src = src.currentSrc || src.src; im.alt = ''; g.appendChild(im);
    document.body.appendChild(g); st.ghost = g;
    grid.drag = st; root.classList.add('sorting'); st.el.classList.add('dragging');
    st.el.classList.remove('armed');
    document.body.style.userSelect = 'none';
    tick();
  }

  function tick() {
    if (!grid.drag) return;
    st.raf = requestAnimationFrame(tick);
    // vị trí ảnh nổi
    st.ghost.style.transform = `translate(${st.cx - st.ox}px,${st.cy - st.oy}px) scale(1.04)`;
    // tự cuộn khi kéo gần mép màn hình
    const H = window.innerHeight, edge = Math.min(110, H * .2);
    let dy = 0; if (st.cy < edge + 60) dy = -Math.ceil((edge + 60 - st.cy) / 5); else if (st.cy > H - edge) dy = Math.ceil((st.cy - (H - edge)) / 5);
    if (dy) window.scrollBy(0, Math.max(-26, Math.min(26, dy)));
    // tìm ảnh đang bị rê tới
    const now = performance.now(); if (now - st.lastMove < 110) return;
    const rr = root.getBoundingClientRect(), px = st.cx - rr.left, py = st.cy - rr.top;
    const items = grid.items, from = items.findIndex(p => p.id === st.id); if (from < 0) return;
    let to = -1;
    for (let i = 0; i < items.length; i++) {
      if (i === from) continue;
      const b = grid.pos.get(items[i].id); if (!b) continue;
      const ix = b.w * .2, iy = b.h * .2;
      if (px >= b.x + ix && px <= b.x + b.w - ix && py >= b.y + iy && py <= b.y + b.h - iy) { to = i; break; }
    }
    if (to < 0) {
      const lastReal = items.reduce((m, p, i) => (p._status ? m : i), -1);
      const maxY = Math.max(0, ...[...grid.pos.values()].map(b => b.y + b.h));
      if (py > maxY + 6 && from !== lastReal) to = lastReal;
      else if (py < -6 && from !== 0) to = items.findIndex(p => !p._status);
    }
    if (to < 0 || to === from || items[to]._status) return;
    const arr = items.slice(); const [m] = arr.splice(from, 1); arr.splice(to, 0, m);
    grid.items = arr; st.lastMove = now; grid.layout();
  }

  async function finish(cancel) {
    const d = st; st = null; if (!d) return;
    if (!d.started) return;
    cancelAnimationFrame(d.raf);
    try { root.releasePointerCapture(d.pid); } catch {}
    d.ghost.remove(); d.el.classList.remove('dragging'); root.classList.remove('sorting');
    document.body.style.userSelect = '';
    grid.drag = null; grid.justDragged = true; setTimeout(() => { grid.justDragged = false; }, 60);
    const albumId = grid.sortAlbum, order = grid.items.map(p => p.id);
    const changed = !cancel && order.join() !== d.orig.join();
    if (cancel) grid.items = d.orig.map(id => S.photos.get(id)).filter(Boolean);
    const pend = grid.pendingList; grid.pendingList = null;
    if (changed) await (grid.sortAll ? commitMoveAll(d.id, order) : commitMove(albumId, d.id, order));
    if (pend) grid.setItems(pend); else grid.layout();
    render();
  }
}

/* Tính số vị trí mới cho ảnh vừa kéo, lưu lên máy chủ (lạc quan: đổi trên màn hình trước, lỗi thì trả lại) */
async function commitMove(albumId, id, order) {
  const real = order.filter(pid => { const p = S.photos.get(pid); return p && !p._status; });
  const i = real.indexOf(id); if (i < 0) return;
  const pos = pid => S.links.get(linkKey(albumId, pid))?.position;
  const above = i > 0 ? pos(real[i - 1]) : undefined, below = i < real.length - 1 ? pos(real[i + 1]) : undefined;
  let updates;
  if (above !== undefined && below !== undefined) {
    if (above - below < 0.001) updates = real.map((pid, k) => ({ photo_id: pid, position: (real.length - k) * 1000 }));   // hết chỗ chèn: đánh số lại cả album
    else updates = [{ photo_id: id, position: (above + below) / 2 }];
  } else if (below !== undefined) updates = [{ photo_id: id, position: below + 1000 }];
  else if (above !== undefined) updates = [{ photo_id: id, position: above - 1000 }];
  else return;
  await savePositions(albumId, updates);
}
async function savePositions(albumId, updates) {
  const prev = updates.map(u => ({ ...S.links.get(linkKey(albumId, u.photo_id)) }));
  const keys = updates.map(u => linkKey(albumId, u.photo_id));
  updates.forEach(u => { const l = S.links.get(linkKey(albumId, u.photo_id)); if (l) S.links.set(linkKey(albumId, u.photo_id), { ...l, position: u.position }); });
  keys.forEach(k => posSaving.set(k, (posSaving.get(k) || 0) + 1));
  render();
  try { await api.setPositions(albumId, updates); }
  catch (err) {
    prev.forEach(l => { if (l.photo_id) S.links.set(linkKey(l.album_id, l.photo_id), l); });
    toast('Không lưu được thứ tự: ' + err.message); render();
  } finally {
    setTimeout(() => keys.forEach(k => { const n = (posSaving.get(k) || 1) - 1; n ? posSaving.set(k, n) : posSaving.delete(k); }), 1500);
  }
}
/* Trang "Tất cả ảnh": lưu vị trí vào cột photos.position */
async function commitMoveAll(id, order) {
  const real = order.filter(pid => { const p = S.photos.get(pid); return p && !p._status; });
  const i = real.indexOf(id); if (i < 0) return;
  const key = pid => sortKey(S.photos.get(pid));
  const above = i > 0 ? key(real[i - 1]) : undefined, below = i < real.length - 1 ? key(real[i + 1]) : undefined;
  let updates;
  if (above !== undefined && below !== undefined) {
    if (above - below < 0.01) { const t = Date.now(); updates = real.map((pid, k) => ({ id: pid, position: t - k * 1000 })); }   // hết chỗ chèn: đánh số lại
    else updates = [{ id, position: (above + below) / 2 }];
  } else if (below !== undefined) updates = [{ id, position: Math.max(below + 1000, Date.now()) }];
  else if (above !== undefined) updates = [{ id, position: above - 1000 }];
  else return;
  await savePhotoPositions(updates);
}
async function savePhotoPositions(updates) {
  const prev = updates.map(u => ({ id: u.id, position: S.photos.get(u.id)?.position ?? null }));
  updates.forEach(u => { if (S.photos.has(u.id)) applyPhoto(u); savingCount.set(u.id, (savingCount.get(u.id) || 0) + 1); });
  render();
  try { for (const part of chunks(updates, 8)) await Promise.all(part.map(u => api.updatePhoto(u.id, { position: u.position }))); }
  catch (err) {
    prev.forEach(u => { if (S.photos.has(u.id)) applyPhoto(u); });
    toast(/position/i.test(err.message) ? 'Chưa lưu được thứ tự: cần chạy 1 dòng SQL trong Supabase để thêm cột "position" (xem hướng dẫn).' : 'Không lưu được thứ tự: ' + err.message, { ms: 8000 });
  }
  updates.forEach(u => { const n = (savingCount.get(u.id) || 1) - 1; n > 0 ? savingCount.set(u.id, n) : savingCount.delete(u.id); });
  render();
}
function moveEdgeAll(id, where) {
  const list = sortedPhotos().filter(p => !p._status); if (list.length < 2) return;
  const first = list[0], last = list[list.length - 1];
  if ((where === 'top' ? first : last).id === id) return toast(where === 'top' ? 'Ảnh đã ở đầu' : 'Ảnh đã ở cuối');
  savePhotoPositions([{ id, position: where === 'top' ? Math.max(sortKey(first) + 1000, Date.now()) : sortKey(last) - 1000 }]);
}
/* Menu: đưa ảnh lên đầu / xuống cuối album (dùng được cả khi không tiện kéo) */
function moveEdge(albumId, id, where) {
  const links = albumLinks(albumId); if (links.length < 2) return;
  const first = links[0], last = links[links.length - 1];
  if (where === 'top' ? first.photo_id === id : last.photo_id === id) return toast(where === 'top' ? 'Ảnh đã ở đầu album' : 'Ảnh đã ở cuối album');
  savePositions(albumId, [{ photo_id: id, position: where === 'top' ? first.position + 1000 : last.position - 1000 }]);
}

let current = null;   // { update(), grid?, destroy() }
const view = $('#view');

function parseRoute() {
  const [a, b] = location.hash.replace(/^#\/?/, '').split('/');
  if (a === 'albums') return { name: 'albums' };
  if (a === 'album' && b) return { name: 'album', id: decodeURIComponent(b) };

}
function go(hash, tries = 0) {

}
function currentAlbumId() { return S.route.name === 'album' ? S.route.id : null; }

function fileRow(f) {

      ${up ? `<div class="fbar"><i style="width:${pct}%"></i></div>` : ''}</div>

}
function canPreview(f) { const e = f.ext || extOf(f.name); return BROWSER_VIEW.has(e) || (!CONFIG.USE_MOCK && OFFICE_VIEW.has(e)); }
function openDoc(f) {
  const e = f.ext || extOf(f.name);
  if (BROWSER_VIEW.has(e)) return window.open(fileUrl(f), '_blank', 'noopener');
  if (OFFICE_VIEW.has(e) && !CONFIG.USE_MOCK) return window.open('https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(fileUrl(f)), '_blank', 'noopener');
  downloadDoc(f);
}
function downloadDoc(f) {
  const a = document.createElement('a'); a.href = fileUrl(f, true); a.download = f.name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function fileMenu(id) {
  const f = S.files.get(id);
  return [
    ...(canPreview(f) ? [{ icon: 'eye', label: 'Xem', run: () => openDoc(f) }] : []),
    { icon: 'download', label: 'Tải về máy', run: () => downloadDoc(f) },
    { icon: 'edit', label: 'Đổi tên', run: () => renameFileFlow(id) },
    ...(CONFIG.USE_MOCK ? [] : [{ icon: 'copy', label: 'Sao chép link tải', run: () => copyText(fileUrl(f, true), 'Đã sao chép link tải tệp') }]),
    '-',
    { icon: 'trash', label: 'Xóa tệp', danger: true, run: () => deleteFilesFlow([id]) },
  ];
}
function copyText(t, ok) { (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast(ok), () => window.prompt('Sao chép link:', t)); }
async function renameFileFlow(id) {
  const f = S.files.get(id); if (!f) return;
  let name = await promptDialog({ title: 'Đổi tên tệp', value: f.name });
  if (!name || name === f.name) return;
  const ext = f.ext || extOf(f.name);
  if (ext && extOf(name) !== ext) name += '.' + ext;   // giữ đuôi tệp để mở đúng chương trình
  const before = f.name; applyFile({ id, name }); render();
  try { applyFile(await api.updateFile(id, { name })); } catch (err) { applyFile({ id, name: before }); toast('Không đổi tên được: ' + err.message); }
  render();
}
function deleteFilesFlow(ids) {
  const rows = ids.map(id => S.files.get(id)).filter(f => f && !f._status); if (!rows.length) return;
  rows.forEach(f => S.pendingFileDel.add(f.id));
  const key = uid();
  const commit = async () => {
    pendingTimers.delete(key);
    try { await api.deleteFiles(rows.map(f => ({ id: f.id, path: f.path }))); rows.forEach(f => { recentDel.set(f.id, Date.now()); removeFileLocal(f.id); }); }
    catch { toast('Xóa tệp thất bại, tệp đã được khôi phục'); }
    rows.forEach(f => S.pendingFileDel.delete(f.id)); render();
  };
  pendingTimers.set(key, { commit, timer: setTimeout(commit, CONFIG.UNDO_MS) });
  render();
  toast(`Đã xóa ${rows.length === 1 ? '“' + rows[0].name + '”' : rows.length + ' tệp'}`, {
    ms: CONFIG.UNDO_MS, action: 'Hoàn tác',
    onAction: () => { const t = pendingTimers.get(key); if (!t) return; clearTimeout(t.timer); pendingTimers.delete(key); rows.forEach(f => S.pendingFileDel.delete(f.id)); render(); },
  });
}

function renderReel() {
  const wrap = $('#reelWrap'), track = $('#reelTrack');
  const pics = REEL_PHOTOS;
  const key = String(pics.length);
  if (key === reelKey) return; reelKey = key;
  wrap.classList.toggle('empty', !pics.length);
  if (!pics.length) { track.innerHTML = ''; return; }
  let half = pics.slice(); while (half.length < 8) half = half.concat(pics);   // đủ dài để phủ kín dải
  const R = [-6, 4, -3, 6, -5, 3, -2, 5];
  const card = (p, i) => `<div class="pol" style="--r:${R[i % R.length]}deg;animation-delay:-${(i * 0.7) % 3.2}s"><img src="${esc(p)}" alt="" decoding="async" draggable="false" onerror="this.style.visibility='hidden'"></div>`;
  track.innerHTML = half.concat(half).map(card).join('');   // nhân đôi → chạy vòng liền mạch
  track.style.setProperty('--dur', (half.length * 2.6) + 's');
}

function render() {
  cancelAnimationFrame(renderRaf);
  renderRaf = requestAnimationFrame(() => {
    current?.update();
    renderBanner();
    renderSync();
    renderReel();
    writeCacheSoon();
    if (S.selecting) renderSelbar();
    if (V.open) refreshViewer();
  });
}
function renderBanner() {
  const used = storageUsed(), b = $('#banner');
  if (S.loadError) { b.className = 'banner danger'; b.innerHTML = `<span>Không kết nối được máy chủ: ${esc(S.loadError)}</span><button class="linkbtn" data-act="refresh">Thử lại</button>`; }

const layers = [];
function pushLayer(closeFn) { layers.push(closeFn); history.pushState({ layer: layers.length }, ''); }
function popLayer() { if (layers.length) history.back(); }
window.addEventListener('popstate', e => {
  const target = e.state?.layer || 0;
  while (layers.length > target) layers.pop()();
});

/* ----- Hộp thoại chung ----- */
function openSheet(html, onMount) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    $('#layerRoot').appendChild(bg);
    let result = null, closed = false;
    const finish = () => { if (closed) return; closed = true; bg.remove(); resolve(result); };
    finish.isSheet = true;
    pushLayer(finish);
    const done = val => { result = val; popLayer(); };
    bg.addEventListener('click', e => { if (e.target === bg) done(null); });
    onMount(bg.firstElementChild, done);
  });
}
function promptDialog({ title, value = '', placeholder = '', ok = 'Lưu' }) {
  return openSheet(`<h3>${esc(title)}</h3><input class="f-in" id="pIn" maxlength="80" placeholder="${esc(placeholder)}" value="${esc(value)}"><div class="acts"><button class="btn" data-x>Hủy</button><button class="btn primary" data-ok>${esc(ok)}</button></div>`, (el, done) => {
    const inp = $('#pIn', el);
    setTimeout(() => { inp.focus(); inp.select(); }, 50);

    $('[data-ok]', el).onclick = submit; $('[data-x]', el).onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
  });
}
function confirmDialog({ title, text, ok = 'Đồng ý', danger = false }) {
  return openSheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn" data-x>Hủy</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div>`, (el, done) => {
    $('[data-ok]', el).onclick = () => done(true); $('[data-x]', el).onclick = () => done(false);
  });
}
/** Chọn album (có ô tạo album mới). Trả về id album hoặc null */
function pickAlbum({ title, excludeId = null, markFor = [] }) {
  const albums = [...S.albums.values()].filter(a => a.id !== excludeId).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
  const allIn = a => markFor.length && markFor.every(pid => S.links.has(linkKey(a.id, pid)));
  const items = albums.map(a => {
    const cov = albumCoverPhotos(a, 1)[0];
    return `<button class="aitem ${allIn(a) ? 'has' : ''}" data-id="${esc(a.id)}"><span class="cv">${cov ? `<img src="${esc(photoUrl(cov, 'thumb'))}" alt="" onerror="this.remove()">` : ''}</span><span><b>${esc(a.name)}</b><small>${fmtNum(albumPhotos(a.id).length)} ảnh${allIn(a) ? ' · đã có' : ''}</small></span></button>`;
  }).join('');
  return openSheet(`<h3>${esc(title)}</h3><div class="row" style="margin-top:12px"><input class="f-in" id="newA" maxlength="80" placeholder="Tên album mới…"><button class="btn primary" id="newABtn">Tạo</button></div><div class="alist">${items || '<div class="sub" style="padding:12px 4px">Chưa có album nào. Gõ tên ở trên để tạo.</div>'}</div><div class="acts"><button class="btn" data-x>Hủy</button></div>`, (el, done) => {

    let busy = false;
    const create = async () => {

      if (busy) return; busy = true;
      try { const a = await api.createAlbum(name); applyAlbum(a); done(a.id); } catch (err) { busy = false; toast('Không tạo được album: ' + err.message); }
    };
    $('#newABtn', el).onclick = create;
    $('#newA', el).onkeydown = e => { if (e.key === 'Enter') create(); };
  });
}

async function addToAlbumFlow(ids, fromSel) {

  if (!aid) return;
  try {
    const links = await api.addToAlbum(aid, ids); links.forEach(applyLink);
    const a = S.albums.get(aid);
    toast(links.length ? `Đã thêm ${links.length} ảnh vào “${a.name}”` : `Ảnh đã có sẵn trong “${a.name}”`, { action: 'Xem album', onAction: () => go('#/album/' + encodeURIComponent(aid)) });
    if (fromSel) clearSelection();
  } catch (err) { toast('Không thêm được: ' + err.message); }

}
async function moveFlow(ids, fromId, fromSel) {
  const aid = await pickAlbum({ title: `Chuyển ${ids.length} ảnh sang album`, excludeId: fromId });

}
async function removeFromAlbumFlow(ids, albumId, fromSel) {
  const removed = ids.map(pid => S.links.get(linkKey(albumId, pid))).filter(Boolean);

    });

async function setCoverFlow(albumId, photoId) {

async function newAlbumFlow() {

async function renameAlbumFlow(id) {

/* ----- Xóa ảnh có Hoàn tác 5 giây ----- */
const pendingTimers = new Map();   // batchKey -> {ids, timer}
function deleteFlow(ids) {
  ids = ids.filter(id => S.photos.get(id) && !S.photos.get(id)._status);
  if (!ids.length) return;
  ids.forEach(id => S.pendingDelete.add(id));
  clearSelection();
  const key = uid();
  const commit = async () => {
    pendingTimers.delete(key);
    try { await api.deletePhotos(ids); ids.forEach(id => { recentDel.set(id, Date.now()); removePhotoLocal(id); }); }
    catch (err) { toast('Xóa thất bại, ảnh đã được khôi phục'); }
    ids.forEach(id => S.pendingDelete.delete(id)); render();
  };
  pendingTimers.set(key, { commit, timer: setTimeout(commit, CONFIG.UNDO_MS) });
  if (V.open && ids.includes(V.id)) viewerAfterRemove();
  render();
  toast(`Đã xóa ${ids.length} ảnh`, {
    ms: CONFIG.UNDO_MS, action: 'Hoàn tác',
    onAction: () => { const t = pendingTimers.get(key); if (!t) return; clearTimeout(t.timer); pendingTimers.delete(key); ids.forEach(id => S.pendingDelete.delete(id)); render(); },
  });
}
function flushDeletes() { for (const [, t] of pendingTimers) { clearTimeout(t.timer); t.commit(); } }
window.addEventListener('pagehide', flushDeletes);

async function downloadPhoto(id) {
  const p = S.photos.get(id); if (!p) return;
  const url = photoUrl(p, 'full');
  const name = (p.original_name ? p.original_name.replace(/\.[^.]+$/, '') : 'anh-' + id.slice(0, 8)) + '.webp';
  try {
    const blob = await (await fetch(url)).blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch { window.open(url, '_blank'); }
}

/* ----- Sao lưu .zip (P3) ----- */
function lastBackup() { try { return localStorage.getItem('tva-last-backup'); } catch { return null; } }
let backingUp = false;
async function backupFlow(btn) {
  if (backingUp) return;
  const photos = [...S.photos.values()].filter(p => !p._status && alive(p));
  const docs = sortedFiles().filter(f => !f._status);
  if (!photos.length && !docs.length) return toast('Chưa có ảnh hay tệp nào để sao lưu');
  const total = photos.reduce((s, p) => s + (p.size_bytes || 0), 0) + docs.reduce((s, f) => s + (f.size_bytes || 0), 0);
  if (isMobile() && total > 300e6) {
    const ok = await confirmDialog({ title: 'Bản sao lưu khá lớn', text: `Khoảng ${fmtBytes(total)}. Điện thoại có thể thiếu bộ nhớ, nên làm trên laptop. Vẫn tiếp tục?`, ok: 'Tiếp tục' });
    if (!ok) return;
  }
  backingUp = true; btn.disabled = true;
  const label = btn.innerHTML;
  try {
    btn.textContent = 'Đang chuẩn bị…';
    if (!window.JSZip) await loadScript(JSZIP_JS);
    const zip = new JSZip();
    const strip = p => Object.fromEntries(Object.entries(p).filter(([k]) => !k.startsWith('_')));
    zip.file('data.json', JSON.stringify({
      app: 'thuvienanh', version: 1, exported_at: nowIso(),
      photos: photos.map(strip), albums: [...S.albums.values()], album_photos: [...S.links.values()], files: docs.map(strip),
    }, null, 2));
    zip.file('DOC-TRUOC.txt', 'Bản sao lưu Thư viện ảnh\n\n- data.json: thông tin ảnh (ghi chú, tag, link nguồn), album và ảnh nào thuộc album nào.\n- full/: ảnh lớn dạng WebP. Tên file = id của ảnh trong data.json.\n- Thumbnail không kèm theo vì có thể tạo lại từ ảnh lớn.\n- tep/: tệp tài liệu, giữ tên gốc (trùng tên thì thêm số).\n');
    const work = photos.slice(), failed = []; let done = 0;
    const worker = async () => {
      while (work.length) {
        const p = work.shift();
        try { const r = await fetch(photoUrl(p, 'full')); if (!r.ok) throw new Error(r.status); zip.file(`full/${p.id}.webp`, await r.blob()); }
        catch { failed.push(p.id); }
        btn.textContent = `Đang tải ảnh ${++done}/${photos.length}…`;
      }
    };
    await Promise.all([1, 2, 3, 4].map(worker));
    const used = new Set();
    for (const f of docs) {
      let nm = f.name.replace(/[\\/:*?"<>|]/g, '_'), k = 1; while (used.has(nm.toLowerCase())) nm = f.name.replace(/(\.[^.]*)?$/, ` (${++k})$1`); used.add(nm.toLowerCase());
      try { const r = await fetch(fileUrl(f)); if (!r.ok) throw 0; zip.file('tep/' + nm, await r.blob()); } catch { failed.push(f.id); }
      btn.textContent = `Đang tải tệp ${used.size}/${docs.length}…`;
    }
    btn.textContent = 'Đang đóng gói…';
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `thuvienanh-saoluu-${new Date().toISOString().slice(0, 10)}.zip`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60e3);
    try { localStorage.setItem('tva-last-backup', nowIso()); } catch {}
    toast(failed.length ? `Đã sao lưu, nhưng ${failed.length} mục không tải được` : `Đã sao lưu ${photos.length} ảnh, ${docs.length} tệp (${fmtBytes(blob.size)})`, { ms: 6000 });
  } catch (err) { toast('Sao lưu thất bại: ' + err.message, { ms: 6000 }); }
  backingUp = false; btn.disabled = false; btn.innerHTML = label;
  render();
}

  }
  renderViewer();
}
function closeViewer() { popLayer(); }
/* Bật/tắt popup thông tin ảnh (mỗi lần mở ảnh mới luôn bắt đầu ở chế độ toàn màn hình) */

const savingCount = new Map();   // ảnh đang có lệnh lưu chưa xong → bỏ qua bản cũ dội về
function flashSaved(t) { V.status = t; const el = $('.v-saved', viewerEl); if (el) el.textContent = t; }
async function savePhoto(id, patch) {
  const cur = S.photos.get(id); if (!cur) return;
  const before = Object.fromEntries(Object.keys(patch).map(k => [k, cur[k]]));
  flashSaved('Đang lưu…');
  applyPhoto({ id, ...patch });
  savingCount.set(id, (savingCount.get(id) || 0) + 1);
  let saved = null, error = null;
  try { saved = await api.updatePhoto(id, patch); } catch (err) { error = err; }
  const left = savingCount.get(id) - 1; left > 0 ? savingCount.set(id, left) : savingCount.delete(id);
  if (error) { if (S.photos.has(id)) applyPhoto({ id, ...before }); toast('Không lưu được: ' + error.message); flashSaved(''); }
  else { if (left <= 0 && S.photos.has(id)) applyPhoto(saved); flashSaved('Đã lưu'); savedFlash(); }
  render();
}
function bindViewerInputs(id) {
  const note = $('#fNote', viewerEl), src = $('#fSrc', viewerEl), tag = $('#fTag', viewerEl);
  const saveNote = debounce(() => savePhoto(id, { note: note.value.trim() }), 600);
  const saveSrc = debounce(() => savePhoto(id, { source_url: src.value.trim() || null }), 600);
  note.oninput = saveNote;
  src.oninput = () => { updateSrcLink(); saveSrc(); };
  const addTag = t => {
    t = normTag(t); const p = S.photos.get(id); if (!t || !p || (p.tags || []).includes(t)) return;
    savePhoto(id, { tags: [...(p.tags || []), t] }); tag.value = ''; renderVTags();
  };
  tag.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(tag.value); }
    else if (e.key === 'Backspace' && !tag.value) { const p = S.photos.get(id); if (p.tags?.length) { savePhoto(id, { tags: p.tags.slice(0, -1) }); renderVTags(); } }
  };
  tag.oninput = () => { if (tag.value.includes(',')) addTag(tag.value.replace(/,/g, '')); else renderTagSugg(); };
  tag.onblur = e => { if (e.relatedTarget?.closest?.('#tagSugg')) return; if (tag.value.trim()) addTag(tag.value); };
  $('#tagBox', viewerEl).onclick = e => { if (e.target.id === 'tagBox') tag.focus(); };
  viewerEl.onclick = async e => {
    const t = e.target.closest('[data-v],[data-rmtag],[data-addtag],[data-tag],[data-rmalbum],[data-goalbum]'); if (!t) return;
    const p = S.photos.get(id); if (!p) return;
    if (t.dataset.v === 'close') return closeViewer();
    if (t.dataset.v === 'prev') return stepViewer(-1);
    if (t.dataset.v === 'next') return stepViewer(1);
    if (t.dataset.v === 'info') return setInfo(!V.info);
    if (t.dataset.v === 'info-hide') return setInfo(false);
    if (t.dataset.v === 'album') return addToAlbumFlow([id]);
    if (t.dataset.v === 'download') return downloadPhoto(id);
    if (t.dataset.v === 'delete') return deleteFlow([id]);
    if (t.dataset.rmtag) { savePhoto(id, { tags: p.tags.filter(x => x !== t.dataset.rmtag) }); return renderVTags(); }
    if (t.dataset.addtag) return addTag(t.dataset.addtag);
    if (t.dataset.tag) { const q = t.dataset.tag; closeViewer(); setTimeout(() => { setQuery(q); if (S.route.name !== 'all') go('#/'); }, 60); return; }
    if (t.dataset.rmalbum) return removeFromAlbumFlow([id], t.dataset.rmalbum);
    if (t.dataset.goalbum) { const aid = t.dataset.goalbum; closeViewer(); setTimeout(() => go('#/album/' + encodeURIComponent(aid)), 60); }
  };
}

/* Vuốt trên điện thoại: trái/phải = ảnh khác, xuống = đóng, lên = xem chi tiết */
function bindSwipe() {
  const stage = $('#vStage', viewerEl), img = $('.v-img', viewerEl);
  let s = null, moved = false;
  stage.onclick = e => { if (moved) { moved = false; return; } if (V.info && !e.target.closest('.v-btn')) setInfo(false); };
  stage.onpointerdown = e => {
    if (e.pointerType === 'mouse' || e.target.closest('.v-btn')) return;
    s = { x: e.clientX, y: e.clientY, axis: null, dx: 0, dy: 0 }; moved = false;
    img.style.transition = 'none';
  };
  stage.onpointermove = e => {
    if (!s) return;
    s.dx = e.clientX - s.x; s.dy = e.clientY - s.y;
    if (Math.hypot(s.dx, s.dy) > 10) moved = true;
    if (!s.axis && Math.hypot(s.dx, s.dy) > 10) s.axis = Math.abs(s.dx) > Math.abs(s.dy) ? 'x' : 'y';
    if (s.axis === 'x') img.style.transform = `translateX(${s.dx}px)`;
    if (s.axis === 'y' && s.dy > 0 && viewerEl.scrollTop <= 0) {
      img.style.transform = `translateY(${s.dy}px) scale(${Math.max(.8, 1 - s.dy / 1500)})`;
      viewerEl.style.background = `rgba(14,14,14,${Math.max(.3, 1 - s.dy / 500)})`;
    }
  };
  const end = () => {
    if (!s) return;
    const { axis, dx, dy } = s; s = null;
    img.style.transition = ''; viewerEl.style.background = '';
    if (axis === 'x' && Math.abs(dx) > 60) {
      const d = dx < 0 ? 1 : -1;
      if (V.list[V.idx + d]) { img.style.transform = `translateX(${dx < 0 ? -40 : 40}px)`; img.style.opacity = 0; return setTimeout(() => stepViewer(d), 120); }
    }
    if (axis === 'y' && dy > 110) { if (V.info) { img.style.transform = ''; return setInfo(false); } return closeViewer(); }
    if (axis === 'y' && dy < -60) setInfo(true);
    img.style.transform = '';
  };
  stage.onpointerup = end; stage.onpointercancel = end;
}
