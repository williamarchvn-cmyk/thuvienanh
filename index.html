const savingCount = new Map();   // ảnh đang có lệnh lưu chưa xong → bỏ qua bản cũ dội về
function flashSaved(t) { V.status = t; const el = $('.v-saved', viewerEl); if (el) el.textContent = t; }
async function savePhoto(id, patch) {
  const cur = S.photos.get(id); if (!cur) return;
  const before = Object.fromEntries(Object.keys(patch).map(k => [k, cur[k]]));
  flashSaved('Đang lưu…');
  applyPhoto({ id, ...patch });
  savingCount.set(id, (savingCount.get(id) || 0) + 1);
  let saved = null, error = null;
  try { saved = await api.updatePhoto(id, patch); } catch (err) { error = err; }
  const left = savingCount.get(id) - 1; left > 0 ? savingCount.set(id, left) : savingCount.delete(id);
  if (error) { if (S.photos.has(id)) applyPhoto({ id, ...before }); toast('Không lưu được: ' + error.message); flashSaved(''); }
  else { if (left <= 0 && S.photos.has(id)) applyPhoto(saved); flashSaved('Đã lưu'); savedFlash(); }
  render();
}
function bindViewerInputs(id) {
  const note = $('#fNote', viewerEl), src = $('#fSrc', viewerEl), tag = $('#fTag', viewerEl);
  const saveNote = debounce(() => savePhoto(id, { note: note.value.trim() }), 600);
  const saveSrc = debounce(() => savePhoto(id, { source_url: src.value.trim() || null }), 600);
  note.oninput = saveNote;
  src.oninput = () => { updateSrcLink(); saveSrc(); };
  const addTag = t => {
    t = normTag(t); const p = S.photos.get(id); if (!t || !p || (p.tags || []).includes(t)) return;
    savePhoto(id, { tags: [...(p.tags || []), t] }); tag.value = ''; renderVTags();
  };
  tag.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(tag.value); }
    else if (e.key === 'Backspace' && !tag.value) { const p = S.photos.get(id); if (p.tags?.length) { savePhoto(id, { tags: p.tags.slice(0, -1) }); renderVTags(); } }
  };
  tag.oninput = () => { if (tag.value.includes(',')) addTag(tag.value.replace(/,/g, '')); else renderTagSugg(); };
  tag.onblur = e => { if (e.relatedTarget?.closest?.('#tagSugg')) return; if (tag.value.trim()) addTag(tag.value); };
  $('#tagBox', viewerEl).onclick = e => { if (e.target.id === 'tagBox') tag.focus(); };
  viewerEl.onclick = async e => {
    const t = e.target.closest('[data-v],[data-rmtag],[data-addtag],[data-tag],[data-rmalbum],[data-goalbum]'); if (!t) return;
    const p = S.photos.get(id); if (!p) return;
    if (t.dataset.v === 'close') return closeViewer();
    if (t.dataset.v === 'prev') return stepViewer(-1);
    if (t.dataset.v === 'next') return stepViewer(1);
    if (t.dataset.v === 'album') return addToAlbumFlow([id]);
    if (t.dataset.v === 'download') return downloadPhoto(id);
    if (t.dataset.v === 'delete') return deleteFlow([id]);
    if (t.dataset.rmtag) { savePhoto(id, { tags: p.tags.filter(x => x !== t.dataset.rmtag) }); return renderVTags(); }
    if (t.dataset.addtag) return addTag(t.dataset.addtag);
    if (t.dataset.tag) { const q = t.dataset.tag; closeViewer(); setTimeout(() => { setQuery(q); if (S.route.name !== 'all') go('#/'); }, 60); return; }
    if (t.dataset.rmalbum) return removeFromAlbumFlow([id], t.dataset.rmalbum);
    if (t.dataset.goalbum) { const aid = t.dataset.goalbum; closeViewer(); setTimeout(() => go('#/album/' + encodeURIComponent(aid)), 60); }
  };
}

/* Vuốt trên điện thoại: trái/phải = ảnh khác, xuống = đóng, lên = xem chi tiết */
function bindSwipe() {
  const stage = $('#vStage', viewerEl), img = $('.v-img', viewerEl);
  let s = null;
  stage.onpointerdown = e => {
    if (e.pointerType === 'mouse' || e.target.closest('.v-btn')) return;
    s = { x: e.clientX, y: e.clientY, axis: null, dx: 0, dy: 0 };
    img.style.transition = 'none';
  };
  stage.onpointermove = e => {
    if (!s) return;
    s.dx = e.clientX - s.x; s.dy = e.clientY - s.y;
    if (!s.axis && Math.hypot(s.dx, s.dy) > 10) s.axis = Math.abs(s.dx) > Math.abs(s.dy) ? 'x' : 'y';
    if (s.axis === 'x') img.style.transform = `translateX(${s.dx}px)`;
    if (s.axis === 'y' && s.dy > 0 && viewerEl.scrollTop <= 0) {
      img.style.transform = `translateY(${s.dy}px) scale(${Math.max(.8, 1 - s.dy / 1500)})`;
      viewerEl.style.background = `rgba(14,14,14,${Math.max(.3, 1 - s.dy / 500)})`;
    }
  };
  const end = () => {
    if (!s) return;
    const { axis, dx, dy } = s; s = null;
    img.style.transition = ''; viewerEl.style.background = '';
    if (axis === 'x' && Math.abs(dx) > 60) {
      const d = dx < 0 ? 1 : -1;
      if (V.list[V.idx + d]) { img.style.transform = `translateX(${dx < 0 ? -40 : 40}px)`; img.style.opacity = 0; return setTimeout(() => stepViewer(d), 120); }
    }
    if (axis === 'y' && dy > 110 && viewerEl.scrollTop <= 0) return closeViewer();
    if (axis === 'y' && dy < -60) viewerEl.scrollTo({ top: stage.offsetHeight - 120, behavior: 'smooth' });
    img.style.transform = '';
  };
  stage.onpointerup = end; stage.onpointercancel = end;
}

/* =========================================================================
   TẢI ẢNH LÊN: nút bấm, Ctrl+V, kéo-thả — chung một đường
   ========================================================================= */
const isImageFile = f => f && (/^image\//.test(f.type) || /\.(heic|heif|avif|webp|jpe?g|png|gif|bmp)$/i.test(f.name || ''));
const queue = []; let active = 0;
const fileInput = $('#fileInput');
fileInput.onchange = () => { enqueue([...fileInput.files], currentAlbumId()); fileInput.value = ''; };
function openFilePicker() {
  if (storageUsed() >= CONFIG.BLOCK_AT) return toast('Kho ảnh đã gần đầy (trên 950 MB). Hãy xóa bớt ảnh trước khi tải lên.', { ms: 6000 });
  fileInput.click();
}

function enqueue(files, albumId, sourceUrl = null) {
  files = files.filter(isImageFile);
  if (!files.length) return toast('Không có file ảnh nào');
  if (storageUsed() >= CONFIG.BLOCK_AT) return toast('Kho ảnh đã gần đầy (trên 950 MB). Hãy xóa bớt ảnh trước khi tải lên.', { ms: 6000 });
  for (const f of files) {
    const job = { id: uid(), file: f, name: f.name && f.name !== 'image.png' ? f.name : 'Ảnh dán', albumId, sourceUrl, status: 'wait', progress: 0, origSize: f.size };
    S.uploads.push(job); queue.push(job);
  }
  $('#uppanel').classList.remove('min');
  renderUploadPanel(); pump();
}
function pump() {
  while (active < CONFIG.UPLOAD_CONCURRENCY && queue.length) {
    const job = queue.shift(); active++;
    runJob(job).finally(() => { active--; renderUploadPanel(); pump(); autoHidePanel(); });
  }
}
async function runJob(job) {
  try {
    if (!job.compressed) { job.status = 'compress'; renderUploadPanel(); job.compressed = await compressImage(job.file); job.newSize = job.compressed.full.size + job.compressed.thumb.size; }
    const c = job.compressed;
    job.createdAt = job.createdAt || nowIso();
    const row = {
      id: job.id, full_path: `full/${job.id}.webp`, thumb_path: `thumb/${job.id}.webp`,
      width: c.width, height: c.height, size_bytes: job.newSize,
      original_name: ['Ảnh dán', 'Ảnh từ web'].includes(job.name) ? '' : job.name, note: '', tags: [], source_url: job.sourceUrl || null,
      created_at: job.createdAt, updated_at: job.createdAt, deleted_at: null,
    };
    if (!S.photos.has(job.id)) applyPhoto({ ...row, _status: 'uploading', _progress: 0, _albumId: job.albumId, _local: { thumb: URL.createObjectURL(c.thumb), full: URL.createObjectURL(c.full) } });
    else applyPhoto({ id: job.id, _status: 'uploading', _progress: 0 });
    job.status = 'upload'; job.progress = 0; render(); renderUploadPanel();
    const saved = await api.uploadPhoto({ id: job.id, fullBlob: c.full, thumbBlob: c.thumb, row }, pr => {
      job.progress = pr;
      const p = S.photos.get(job.id); if (p) { p._progress = pr; const el = cardEls.get(job.id); if (el) updateCard(el, p); }
      renderUploadPanel();
    });
    applyPhoto({ ...saved, _status: null, _savedAt: Date.now() });
    if (job.albumId && S.albums.has(job.albumId)) { const ls = await api.addToAlbum(job.albumId, [job.id]); ls.forEach(applyLink); }
    job.status = 'done';
  } catch (err) {
    job.status = 'error'; job.error = err.message || 'Lỗi không rõ';
    if (S.photos.has(job.id)) applyPhoto({ id: job.id, _status: 'error' });
  }
  render();
}
function retryUpload(id) {
  const job = S.uploads.find(j => j.id === id); if (!job || job.status !== 'error') return;
  if (!job.compressed) return toast('Ảnh này không đọc được, không thể thử lại');
  job.status = 'wait'; job.error = null; queue.push(job); renderUploadPanel(); pump();
}

/* Nén ảnh ngay trên trình duyệt → WebP (ảnh lớn ≤2000px + thumbnail 600px) */
async function compressImage(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch {
    try { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
    catch { throw new Error(/hei[cf]$/i.test(file.name) ? 'Trình duyệt không đọc được ảnh HEIC' : 'Không đọc được file ảnh này'); }
  }
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
  const s = Math.min(1, CONFIG.FULL_MAX / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const full = await toWebp(src, w, h, CONFIG.FULL_Q);
  const ts = Math.min(1, CONFIG.THUMB_W / w0);
  const thumb = await toWebp(src, Math.round(w0 * ts), Math.round(h0 * ts), CONFIG.THUMB_Q);
  src.close?.();
  return { full, thumb, width: w, height: h };
}
function toWebp(src, w, h, q) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, w, h);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Không nén được ảnh')), 'image/webp', q));
}

/* ----- Bảng tiến độ tải lên ----- */
const upPanel = $('#uppanel');
function renderUploadPanel() {
  const jobs = S.uploads;
  if (!jobs.length) { upPanel.classList.remove('show'); return; }
  upPanel.classList.add('show');
  const done = jobs.filter(j => j.status === 'done').length, err = jobs.filter(j => j.status === 'error').length;
  const running = jobs.length - done - err;
  const head = running ? `Đang tải lên ${done}/${jobs.length}` : err ? `Xong ${done}/${jobs.length} · ${err} lỗi` : `Đã tải lên ${done} ảnh`;
  const st = j => j.status === 'wait' ? 'Đang chờ' : j.status === 'compress' ? 'Đang nén…' : j.status === 'upload' ? `Đang tải ${Math.round(j.progress * 100)}%` : j.status === 'done' ? 'Xong' : 'Lỗi';
  const pct = j => j.status === 'done' ? 100 : j.status === 'upload' ? Math.round(j.progress * 100) : j.status === 'compress' ? 5 : 0;
  upPanel.innerHTML = `<div class="uphead"><span>${head}</span><button data-u="min" aria-label="Thu gọn">${icon(upPanel.classList.contains('min') ? 'left' : 'right', 18)}</button>${running ? '' : `<button data-u="close" aria-label="Đóng">${icon('x', 18)}</button>`}</div>
  <div class="uplist">${jobs.slice().reverse().map(j => `<div class="upitem ${j.status === 'error' ? 'err' : j.status === 'done' ? 'ok' : ''}">
    <div class="r1"><span class="nm">${esc(j.name)}</span><span class="st">${st(j)}</span></div>
    <div class="r2"><span>${fmtBytes(j.origSize)}${j.newSize ? ' → ' + fmtBytes(j.newSize) : ''}</span>${j.status === 'error' ? `<span>${esc(j.error)}${j.compressed ? ` · <button class="retry" data-retry="${j.id}">Thử lại</button>` : ''}</span>` : ''}</div>
    ${j.status === 'done' || j.status === 'error' ? '' : `<div class="bar"><i style="width:${pct(j)}%"></i></div>`}</div>`).join('')}</div>`;
}
upPanel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.retry) return retryUpload(b.dataset.retry);
  if (b.dataset.u === 'min') { upPanel.classList.toggle('min'); return renderUploadPanel(); }
  if (b.dataset.u === 'close') { S.uploads = S.uploads.filter(j => j.status !== 'done' && j.status !== 'error'); dropErrorTemps(); renderUploadPanel(); }
});
function dropErrorTemps() { for (const p of [...S.photos.values()]) if (p._status === 'error') removePhotoLocal(p.id); render(); }
const autoHidePanel = debounce(() => {
  if (S.uploads.length && S.uploads.every(j => j.status === 'done')) { S.uploads = []; renderUploadPanel(); }
}, 4000);

window.addEventListener('beforeunload', e => { if (active || queue.length) { e.preventDefault(); e.returnValue = ''; } });

/* ----- Ctrl+V ----- */
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(isImageFile);
  if (!files.length) return;
  e.preventDefault();
  if (V.open) closeViewer();
  enqueue(files, currentAlbumId());
});

/* ----- Kéo-thả từ ngoài vào ----- */
let dragDepth = 0;
const dropEl = $('#drop');
let internalDrag = false;
window.addEventListener('dragstart', () => { internalDrag = true; });
window.addEventListener('dragend', () => { internalDrag = false; });
const isExternalDrag = e => { if (internalDrag) return false; const t = [...(e.dataTransfer?.types || [])]; return t.includes('Files') || t.includes('text/uri-list'); };
window.addEventListener('dragenter', e => {
  if (!isExternalDrag(e)) return; e.preventDefault(); dragDepth++;
  const a = currentAlbumId() && S.albums.get(currentAlbumId());
  $('#dropSub').textContent = a ? `Ảnh sẽ vào album “${a.name}”` : 'Ảnh sẽ vào Tất cả ảnh';
  dropEl.classList.add('show');
});
window.addEventListener('dragover', e => { if (!isExternalDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', e => { if (!isExternalDrag(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropEl.classList.remove('show'); });
window.addEventListener('drop', e => {
  if (!isExternalDrag(e)) return; e.preventDefault(); dragDepth = 0; dropEl.classList.remove('show');
  const files = [...e.dataTransfer.files].filter(isImageFile);
  if (files.length) return enqueue(files, currentAlbumId());
  // Trang web kia chỉ gửi link → thử tải ảnh về; nếu bị chặn thì hướng dẫn dán
  const html = e.dataTransfer.getData('text/html') || '', uri = e.dataTransfer.getData('text/uri-list') || '';
  const url = (html.match(/<img[^>]+src=["']([^"']+)/i)?.[1] || uri.split(/\r?\n/).find(l => l && !l.startsWith('#')) || '').replace(/&amp;/g, '&').trim();
  const albumId = currentAlbumId();
  const hint = () => toast('Trang web kia không cho lấy file ảnh. Hãy chuột phải vào ảnh → “Sao chép hình ảnh”, rồi bấm Ctrl+V ở đây.', { ms: 8000 });
  if (!/^(https?:|data:image\/)/i.test(url)) return hint();
  fetch(url).then(r => r.ok ? r.blob() : Promise.reject()).then(b => {
    if (!/^image\//.test(b.type)) throw 0;
    enqueue([new File([b], 'Ảnh từ web', { type: b.type })], albumId, /^https?:/i.test(url) ? url : null);
  }).catch(hint);
});

/* =========================================================================
   THÔNG BÁO
   ========================================================================= */
function toast(msg, { action, onAction, ms = 3500 } = {}) {
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { el.remove(); onAction?.(); };
  box.appendChild(el);
  setTimeout(() => el.remove(), ms);
  return el;
}

/* =========================================================================
   TÌM KIẾM
   ========================================================================= */
const qInput = $('#q'), qBox = $('#searchBox');
function setQuery(v) { qInput.value = v; S.query = v.trim(); qBox.classList.toggle('has', !!v); if (S.route.name === 'settings') go('#/'); else render(); }
const onQuery = debounce(() => setQuery(qInput.value), 120);
qInput.addEventListener('input', () => { qBox.classList.toggle('has', !!qInput.value); onQuery(); });
qInput.addEventListener('keydown', e => { if (e.key === 'Escape') { setQuery(''); qInput.blur(); } if (e.key === 'Enter') qInput.blur(); });
$('#qClear').onclick = e => { e.preventDefault(); setQuery(''); qInput.focus(); };

/* =========================================================================
   ĐỒNG BỘ (làm mới, nhận thay đổi từ thiết bị khác)
   ========================================================================= */
let refreshing = null;
function refreshAll(showToast) {
  if (!refreshing) refreshing = doRefresh(showToast).finally(() => { refreshing = null; });
  return refreshing;
}
async function doRefresh(showToast) {
  if (!api || (!CONFIG.USE_MOCK && !sb)) return;
  S.sync = 'syncing'; renderSync();
  try {
    loadSnapshot(await api.listAll());
    S.loaded = true; S.loadError = null;
    S.sync = navigator.onLine && !realtimeDown ? 'ok' : 'offline';
    if (showToast) toast('Đã làm mới');
  } catch (err) {
    S.sync = 'offline';
    const msg = /failed to fetch|networkerror|load failed/i.test(err.message) ? 'không có mạng, sai SUPABASE_URL, hoặc project Supabase đang tạm dừng' : err.message;
    if (!S.loaded) S.loadError = msg; else toast('Không làm mới được: ' + msg);
  }
  render();
}
let realtimeDown = false;
/* Nhận thay đổi tức thời. Thay đổi do chính máy này làm cũng quay về đây — các hàm apply đều chạy lại an toàn. */
function startRealtime() {
  api.subscribe(({ table, type, row, old }) => {
    if (table === 'photos') { if (type === 'DELETE') removePhotoLocal(old.id); else if (!(type === 'UPDATE' && savingCount.has(row.id))) applyPhoto(row); }
    if (table === 'albums') type === 'DELETE' ? removeAlbumLocal(old.id) : applyAlbum(row);
    if (table === 'album_photos') {
      if (type === 'DELETE') removeLink(old.album_id, old.photo_id);
      else if (!(type === 'UPDATE' && posSaving.get(linkKey(row.album_id, row.photo_id)) > 0)) applyLink(row);
    }
    render();
  }, status => {
    if (status === 'SUBSCRIBED') {
      if (realtimeDown) { realtimeDown = false; refreshAll(false); }   // bù các thay đổi bị lỡ khi mất kết nối
      else { S.sync = navigator.onLine ? 'ok' : 'offline'; renderSync(); }
    } else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) {
      realtimeDown = true; S.sync = 'offline'; renderSync();
    }
  });
}
window.addEventListener('online', () => refreshAll(false));
window.addEventListener('offline', () => { S.sync = 'offline'; renderSync(); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); flushDeletes(); }
  else if (hiddenAt && Date.now() - hiddenAt > 30e3) refreshAll(false);
});

/* Kéo xuống để làm mới (điện thoại) */
(() => {
  const el = $('#ptr'); el.innerHTML = icon('refresh', 20);
  let y0 = null, dy = 0;
  window.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && !V.open && !layers.length && !S.selecting) ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (y0 === null) return;
    if (current?.grid?.armed || current?.grid?.drag) { y0 = null; dy = 0; el.style.transform = ''; el.style.opacity = 0; return; }   // đang kéo sắp xếp ảnh: không làm mới
    dy = e.touches[0].clientY - y0; if (dy <= 0) return;
    el.style.transform = `translateY(${Math.min(dy * .5, 70)}px) rotate(${dy * 2}deg)`; el.style.opacity = Math.min(1, dy / 80);
    el.classList.toggle('ready', dy > 100);
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 === null) return; y0 = null;
    if (dy > 100) { el.classList.add('spin'); el.style.transform = 'translateY(60px)'; await refreshAll(true); el.classList.remove('spin'); }
    el.style.transform = ''; el.style.opacity = 0; el.classList.remove('ready');
  });
})();

/* =========================================================================
   NÚT BẤM CHUNG + PHÍM TẮT
   ========================================================================= */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); return go(g.dataset.go); }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'upload') return openFilePicker();
  if (act === 'clearq') return setQuery('');
  if (act === 'newalbum') return newAlbumFlow();
  if (act === 'refresh') return (!CONFIG.USE_MOCK && !sb) ? location.reload() : refreshAll(true);
  if (act === 'orphans') {
    a.disabled = true; a.textContent = 'Đang kiểm tra…';
    api.cleanupOrphans().then(n => toast(n ? `Đã xóa ${n} file thừa` : 'Không có file thừa nào'), err => toast('Lỗi: ' + err.message))
      .finally(() => { a.disabled = false; a.textContent = 'Dọn file thừa'; });
    return;
  }
  if (act === 'backup') return backupFlow(a);
  if (act === 'mock500') { seedMock(500); refreshAll(false).then(() => toast('Đã thêm 500 ảnh mẫu')); return; }
  if (act === 'mockremote') return simulateRemote();
  if (act === 'mockreset') return location.reload();
});
document.addEventListener('keydown', e => {
  const typing = e.target.matches?.('input,textarea');
  if (layers.slice(-1)[0]?.isSheet) { if (e.key === 'Escape') popLayer(); return; }
  if (V.open) {
    if (e.key === 'Escape') { if (typing) e.target.blur(); else if (layers.length === 1) closeViewer(); return; }
    if (!typing && e.key === 'ArrowRight') return stepViewer(1);
    if (!typing && e.key === 'ArrowLeft') return stepViewer(-1);
  }
  if (typing) return;
  if (e.key === 'Escape') { closeMenu(); clearSelection(); }
  if (e.key === '/' && !V.open && !layers.length) { e.preventDefault(); qInput.focus(); }
});

function simulateRemote() {
  toast('Sẽ có ảnh mới từ “thiết bị khác” sau 1 giây…');
  setTimeout(() => {
    const row = makeMockPhoto(nowIso());
    row.note = 'Ảnh thêm từ điện thoại'; row.tags = ['từ điện thoại'];
    mockDb.photos.unshift(clone(row));
    mockSubs.forEach(h => h({ table: 'photos', type: 'INSERT', row }));
    toast('1 ảnh mới từ thiết bị khác');
  }, 1000);
}

/* =========================================================================
   KHỞI ĐỘNG
   ========================================================================= */
(async function init() {
  // Gắn icon vào nút điều hướng
  const navIcons = { '#/': 'home', '#/albums': 'albums', '#/settings': 'settings' };
  $$('.navbtn[data-go]').forEach(b => b.innerHTML = icon(navIcons[b.dataset.go], 24));
  $$('.navbtn[data-act="upload"]').forEach(b => b.innerHTML = icon('plus', 26));
  $('.search .si').innerHTML = icon('search', 20);
  $('#qClear').innerHTML = icon('x', 18);
  $('#topUpload').innerHTML = icon('upload', 18) + ' Tải ảnh lên';
  $('#drop .ic').innerHTML = icon('upload', 34);
  $('#mockPill').style.display = CONFIG.USE_MOCK ? '' : 'none';
  window.addEventListener('hashchange', mountRoute);
  window.addEventListener('resize', closeMenu);
  if (!navigator.onLine) S.sync = 'offline';
  mountRoute();
  if (!CONFIG.USE_MOCK) {
    try {
      await loadScript(SB_JS);
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    } catch (err) { S.loadError = err.message; S.sync = 'offline'; render(); return; }
  }
  await refreshAll(false);
  startRealtime();
})();
</script>
